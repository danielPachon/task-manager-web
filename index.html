<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Kanban task manager built with React and TypeScript on top of a Node.js REST API." />
    <title>Task Manager</title>
    <script>
      try {
        var t = localStorage.getItem('tm.theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        var l = localStorage.getItem('tm.lang')
        if (!l) l = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en'
        document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
